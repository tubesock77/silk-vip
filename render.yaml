services:
  - type: web
    name: silk-vip
    runtime: node
    plan: starter            # $7/mo, always on. "free" works but sleeps and takes ~30-60s to wake.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silk-vip-db
          property: connectionString
      - key: ADMIN_USER
        value: april
      - key: ADMIN_PASSWORD
        sync: false          # Render will ask you to type this in during setup
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: silk-vip-db
    plan: basic-256mb        # ~$6/mo, permanent. Render's free database is deleted after 30 days.
    databaseName: silk_vip
    user: silk
