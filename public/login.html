<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login · Silk VIP</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f6f1ea;color:#2a2421;min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{background:#fffdfa;border:1px solid #e6ddd2;border-radius:16px;padding:28px 22px;width:100%;max-width:360px}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  p{color:#7a6f68;font-size:14px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:500;margin:12px 0 6px}
  input{width:100%;font-size:16px;padding:12px;border:1px solid #e6ddd2;border-radius:10px}
  input:focus{outline:none;border-color:#a8875a}
  button{width:100%;margin-top:20px;font-size:16px;font-weight:500;padding:14px;border:0;border-radius:999px;background:#2a2421;color:#fff;cursor:pointer}
  .err{display:none;background:#fbeae6;color:#b3412f;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:8px}
</style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <h1>Silk VIP Admin</h1>
    <p>Sign in to view the VIP list.</p>
    <div class="err" id="err"></div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get('e');
    const box = document.getElementById('err');
    if (e === 'bad') { box.textContent = 'Wrong username or password.'; box.style.display = 'block'; }
    if (e === 'locked') { box.textContent = 'Too many attempts. Try again in 15 minutes.'; box.style.display = 'block'; }
  </script>
</body>
</html>
